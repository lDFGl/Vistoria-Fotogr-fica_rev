name: Deploy Vistoria FG

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos do site
        run: cp logo-fg.png www/logo-fg.png

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: './www'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
